services:
  postgres:
    image: postgres:18.1
    ports:
      - 5432:5432
    volumes:
      - ./data/postgres:/var/lib/postgresql
    environment:
      - POSTGRES_DB=haste_health
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    # The search backend indexes into its own database, kept apart from the
    # repository's.
    command:
      - bash
      - -c
      - |
        docker-entrypoint.sh postgres -c wal_level=logical &
        until pg_isready -U "$$POSTGRES_USER" -q; do sleep 1; done
        psql -v ON_ERROR_STOP=1 -U "$$POSTGRES_USER" -tc \
          "SELECT 1 FROM pg_database WHERE datname = 'haste_health_search'" \
          | grep -q 1 || createdb -U "$$POSTGRES_USER" haste_health_search
        wait
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres && psql -U postgres -lqt | cut -d'|' -f1 | grep -qw haste_health_search",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  hastehealth-migrate:
    image: ghcr.io/hastehealth/hastehealth/hastehealth:latest
    platform: linux/amd64
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/bash"]
    command: >
      -c "/haste-health admin migrate all && /haste-health admin tenant create --id=my-health '--owner-email=myuser@health.org' --owner-password=testing_password --subscription-tier=unlimited"

    environment:
      - HASTE_REPO.backend=postgres
      - HASTE_REPO.database_url=postgresql://postgres:postgres@postgres:5432/haste_health
      - HASTE_REPO.max_connections=20
      - HASTE_SEARCH.backend=postgres
      - HASTE_SEARCH.database_url=postgresql://postgres:postgres@postgres:5432/haste_health_search
      - HASTE_SEARCH.max_connections=20
      - HASTE_API_URI=http://localhost:3000

  hastehealth-server:
    image: ghcr.io/hastehealth/hastehealth/hastehealth:latest
    platform: linux/amd64
    ports:
      - 3000:3000
    depends_on:
      hastehealth-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    command:
      - server
      - start
    environment:
      - HASTE_CERTIFICATION_DIR=certifications
      - HASTE_ADMIN_APP_REDIRECT_URI=http://*.localhost:3001
      - HASTE_API_URI=http://localhost:3000
      - HASTE_REPO.backend=postgres
      - HASTE_REPO.database_url=postgresql://postgres:postgres@postgres:5432/haste_health
      - HASTE_REPO.max_connections=20
      - HASTE_SEARCH.backend=postgres
      - HASTE_SEARCH.database_url=postgresql://postgres:postgres@postgres:5432/haste_health_search
      - HASTE_SEARCH.max_connections=20

  hastehealth-worker:
    image: ghcr.io/hastehealth/hastehealth/hastehealth:latest
    platform: linux/amd64
    command:
      - worker
    depends_on:
      hastehealth-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      - RUST_LOG=error
      - HASTE_REPO.backend=postgres
      - HASTE_REPO.database_url=postgresql://postgres:postgres@postgres:5432/haste_health
      - HASTE_REPO.max_connections=20
      - HASTE_SEARCH.backend=postgres
      - HASTE_SEARCH.database_url=postgresql://postgres:postgres@postgres:5432/haste_health_search
      - HASTE_SEARCH.max_connections=20
      - HASTE_API_URI=http://localhost:3000

  hastehealth-admin-app:
    image: ghcr.io/hastehealth/hastehealth/admin-app:latest
    platform: linux/amd64
    ports:
      - 3001:80
    depends_on:
      - hastehealth-worker
      - hastehealth-server
    environment:
      - VITE_FHIR_BASE_URL=http://localhost:3000
