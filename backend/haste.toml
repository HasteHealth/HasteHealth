api_uri = "http://localhost:3000"
certification_dir = "certifications"
admin_app_redirect_uri = "http://*.localhost:3001"
max_request_body_size = 20971520                   # 20MB

[repo]
backend = "postgres"
database_url = "postgresql://postgres:postgres@localhost:5432/haste_health"
max_connections = 20

[search]
backend = "postgres"
database_url = "postgresql://postgres:postgres@localhost:5432/haste_health_search"
max_connections = 20

[monitoring]
audit_enabled = false

# Sign-up and login codes are written to the server log instead of emailed.
# Set `backend = "sendgrid"` with `api_key` and `from_address` to send them.
[email]
backend = "log"

# Optional Cloudflare Turnstile bot check on the sign-up and login forms.
# [signup.turnstile]
# site_key = "..."
# secret_key = "..."

[security]
publicize_fhir_metadata = true
aes_key = "AES_KEY"
certification_key = "CERTIFICATE_KEY"

[security.mfa]
max_credentials_per_user = 1

[security.encryption]
type = "environment"
prefix = "HASTE_SECRET_"
