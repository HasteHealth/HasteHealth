[package]
name = "haste-repository"
version = { workspace = true }
edition = { workspace = true }
description = "Repository/storage for Haste Health resources."
license = { workspace = true }
homepage = { workspace = true }

[features]
rate-limit = []

[dependencies]
haste-document-storage = { path = "../document-storage", version = "0.*", default-features = false, features = [
    "filesystem",
    "gcs",
    "postgres",
] }
haste-fhir-client = { path = "../fhir-client", version = "0.*" }
haste-fhir-model = { path = "../fhir-model", version = "0.*", features = [
    "sqlx",
] }
haste-fhir-operation-error = { path = "../fhir-operation-error", version = "0.*", features = [
    "derive",
] }
haste-jwt = { path = "../jwt", version = "0.*", features = ["sqlx"] }
haste-rate-limit = { path = "../rate-limit", version = "0.*" }
haste-reflect = { path = "../reflect", version = "0.*", features = ["derive"] }
haste-subscription = { path = "../subscription", version = "0.*" }

argon2 = { workspace = true }
base64 = { workspace = true, features = ["alloc"] }
chrono = { workspace = true }
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
moka = { workspace = true, features = ["future"] }
nanoid = { version = "0.4.0", default-features = false }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true, features = [
    "runtime-tokio",
    "tls-rustls-ring-native-roots",
    "postgres",
    "time",
] }
sqlx-postgres = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "rt-multi-thread"] }
