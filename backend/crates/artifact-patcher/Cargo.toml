[package]
name = "haste-artifact-patcher"
publish = false
description = "Applies patches and rules to externally provided (HL7) FHIR artifacts without editing the originals."
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }

[dependencies]
json-patch = { workspace = true }
pulldown-cmark = { version = "0.13.0", default-features = false }
serde = { workspace = true, features = ["derive"] }
# Keep upstream key order so outputs diff cleanly against the previous build.
serde_json = { workspace = true, features = ["std", "preserve_order"] }
thiserror = { workspace = true }
toml = { version = "0.9.12", default-features = false, features = [
    "parse",
    "serde",
] }
url = { version = "2.5.8", default-features = false, features = ["std"] }
walkdir = { workspace = true }
