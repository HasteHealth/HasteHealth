name: <Test> E2E ONC (g)(10)

# Runs backend/testscripts/g10: the ONC (g)(10) Standardized API checks that a
# TestScript can express (backend/testscripts/g10/README.md maps them to the
# Inferno g10 test kit). Each directory there is a scenario run by
# .github/scripts/access_control.mjs: the shared setup and each scenario's
# setup as the admin, then each scenario's tests as its signed-in patient,
# practitioner or backend client. TestScripts listed in
# backend/testscripts/g10/known-failures.txt fail today and are not run.
#
# Postgres search backend only: g10 certifies the default deployment.
#
# Called by test_e2e.yml, which builds the binary this downloads.
on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  g10:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HASTE_CERTIFICATION_DIR: certifications
      HASTE_ADMIN_APP_REDIRECT_URI: http://*.localhost:3001
      HASTE_API_URI: http://localhost:3000
      HASTE_REPO.backend: postgres
      HASTE_REPO.database_url: postgresql://postgres:postgres@localhost:5432/haste_health
      HASTE_SEARCH.backend: postgres
      HASTE_SEARCH.database_url: postgresql://postgres:postgres@localhost:5432/haste_health_search
      HASTE_SEARCH.max_connections: 20
      RUST_LOG: none
      SCENARIOS: testscripts/g10

    services:
      postgres:
        # Google's mirror of Docker Hub, which rate-limits anonymous pulls from runners.
        image: mirror.gcr.io/library/postgres:18.1
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        env:
          POSTGRES_DB: haste_health
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: haste-health-binary

      - name: Install binary
        run: |
          mkdir -p backend/target/debug
          tar -xzf haste-health.tar.gz -C backend/target/debug

      # The Postgres search backend indexes into its own database, apart from
      # the repo's.
      - name: Create search database
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE haste_health_search;"

      - name: Run migrations
        run: ./target/debug/haste-health admin migrate search && ./target/debug/haste-health admin migrate repo
        working-directory: ./backend

      - name: Start server and worker
        run: |
          ./target/debug/haste-health server start > server.log 2>&1 &
          ./target/debug/haste-health worker > worker.log 2>&1 &
        working-directory: ./backend

      - name: Migrate artifacts
        run: ./target/debug/haste-health admin migrate artifacts
        working-directory: ./backend

      # `testing` is the admin client that runs the setups.
      - name: Set up tenant and admin client
        run: |
          ./target/debug/haste-health admin tenant create --id=my-health '--owner-email=myuser@health.org' --owner-password=testing_password --subscription-tier=unlimited
          ./target/debug/haste-health admin client create --id testing --secret testing --tenant my-health --project system --grant-type client-credentials
          ./target/debug/haste-health profile create testing --auth-mode client-credentials --r4-url http://localhost:3000/w/my-health/system/api/v1/fhir/r4 --discovery-uri http://localhost:3000/.well-known/openid-configuration/w/my-health/system --client-id testing --client-secret testing
        working-directory: ./backend

      # A token's access policies come from search, so index before the first one.
      - name: Wait for indexing
        run: bash .github/scripts/wait_for_indexing.sh 600

      - name: Wait for server
        run: |
          for i in {1..30}; do
            if ./target/debug/haste-health api capabilities > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become ready" >&2
          exit 1
        working-directory: ./backend

      # The US Core profiles and search parameters the record is checked against:
      # US Core 7.0.0, one of the versions (g)(10) certifies, installed from its
      # folder in artifacts/ without its dependencies (see test_e2e_us_core_7.yml).
      - name: Install US Core 7.0.0
        run: ./target/debug/haste-health package install ../artifacts/r4/hl7.fhir.us.core-7.0.0 --no-dependencies
        working-directory: ./backend

      - name: Wait for US Core profiles to be indexed
        run: bash .github/scripts/wait_for_indexing.sh 600

      # The server caches the CapabilityStatement for up to 30 seconds, so the
      # one cached by "Wait for server" can still lack the US Core profiles
      # that 12.1.05 looks for. Wait until it lists them.
      - name: Wait for the CapabilityStatement to list US Core
        run: |
          for i in {1..60}; do
            if capabilities=$(./target/debug/haste-health api capabilities) \
              && [[ "$capabilities" == *us-core-implantable-device* ]]; then
              exit 0
            fi
            sleep 1
          done
          echo "The CapabilityStatement does not list the US Core profiles" >&2
          exit 1
        working-directory: ./backend

      # The admin writes the shared US Core record, then each scenario's data,
      # client and any user.
      - name: "g10: setup"
        run: node .github/scripts/access_control.mjs setup
        env:
          RUST_LOG: info

      # The tests search the record written above, which a TestScript does
      # not wait for on its own (it waits only for its own writes).
      - name: Wait for the record to be indexed
        run: bash .github/scripts/wait_for_indexing.sh 600

      # Each scenario's user or client signs in with a fresh password or secret.
      - name: "g10: sign in"
        run: node .github/scripts/access_control.mjs sign-in

      # Each scenario's tests run as its signed-in user or client.
      - name: "g10: test"
        run: node .github/scripts/access_control.mjs test
        env:
          RUST_LOG: info

      - name: Upload TestReports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: g10-testreports
          path: backend/g10-reports/
          if-no-files-found: ignore

      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: g10-logs
          path: |
            backend/server.log
            backend/worker.log
          if-no-files-found: ignore
