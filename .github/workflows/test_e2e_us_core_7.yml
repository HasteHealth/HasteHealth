name: <Test> US Core 7.0.0 TestScripts

# Runs the US Core 7.0.0 TestScripts, backend/testscripts/us-core/7.0.0,
# against both search backends, with the US Core 7.0.0 package loaded
# (artifacts/r4/hl7.fhir.us.core-7.0.0, exactly as HL7 publishes it). 7.0.0 is
# the US Core version the ONC (g)(10) test kit certifies against. It runs apart
# from the 9.0.0 TestScripts (test_e2e_us_core.yml) because both packages use
# the same canonical URLs, so a project can hold only one of them.
#   examples/   each US Core 7.0.0 example written with its profile claimed
#               (generated/, from scripts/testscript_build.sh)
#   profiles/   one profile conformance script per US Core profile, naming
#               the version in its TestScript.metadata
#
# Called by test_e2e.yml, which builds the binary this downloads and deploys
# the website's US Core 7.0.0 conformance page from these TestReports.
on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  us-core-7:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        search-backend: [elasticsearch, postgres]
    env:
      HASTE_CERTIFICATION_DIR: certifications
      HASTE_ADMIN_APP_REDIRECT_URI: http://*.localhost:3001
      HASTE_API_URI: http://localhost:3000
      HASTE_REPO.backend: postgres
      HASTE_REPO.database_url: postgresql://postgres:postgres@localhost:5432/haste_health
      RUST_LOG: none

    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.2.4
        ports:
          - 9200:9200
        env:
          ELASTIC_PASSWORD: elastic
          discovery.type: single-node
          xpack.security.enabled: true
          xpack.security.http.ssl.enabled: false
          xpack.license.self_generated.type: trial
          xpack.ml.use_auto_machine_memory_percent: true
          ES_JAVA_OPTS: -Xms128m -Xmx2g
          cluster.routing.allocation.disk.watermark.low: 1gb
          cluster.routing.allocation.disk.watermark.high: 1gb
          cluster.routing.allocation.disk.watermark.flood_stage: 1gb

      postgres:
        # Google's mirror of Docker Hub, which rate-limits anonymous pulls from runners.
        image: mirror.gcr.io/library/postgres:18.1
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        env:
          POSTGRES_DB: haste_health
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: haste-health-binary

      - name: Install binary
        run: |
          mkdir -p backend/target/debug
          tar -xzf haste-health.tar.gz -C backend/target/debug

      # The postgres search backend indexes into its own database, apart from
      # the repo's.
      - name: Create search database (Postgres backend)
        if: matrix.search-backend == 'postgres'
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE haste_health_search;"

      - name: Configure search backend (Elasticsearch)
        if: matrix.search-backend == 'elasticsearch'
        run: |
          echo "HASTE_SEARCH.backend=elasticsearch" >> "$GITHUB_ENV"
          echo "HASTE_SEARCH.url=http://localhost:9200" >> "$GITHUB_ENV"
          echo "HASTE_SEARCH.username=elastic" >> "$GITHUB_ENV"
          echo "HASTE_SEARCH.password=elastic" >> "$GITHUB_ENV"

      - name: Configure search backend (Postgres)
        if: matrix.search-backend == 'postgres'
        run: |
          echo "HASTE_SEARCH.backend=postgres" >> "$GITHUB_ENV"
          echo "HASTE_SEARCH.database_url=postgresql://postgres:postgres@localhost:5432/haste_health_search" >> "$GITHUB_ENV"
          echo "HASTE_SEARCH.max_connections=20" >> "$GITHUB_ENV"

      - name: Wait for Elasticsearch
        if: matrix.search-backend == 'elasticsearch'
        run: |
          for i in {1..60}; do
            curl --silent --fail -u elastic:elastic http://localhost:9200 > /dev/null && exit 0
            sleep 2
          done
          echo "Elasticsearch did not become ready" >&2
          exit 1

      - name: Run migrations
        run: ./target/debug/haste-health admin migrate search && ./target/debug/haste-health admin migrate repo
        working-directory: ./backend

      # One worker per repo database: the indexing position is per tenant, not
      # per backend, so a second worker would take half the resources.
      - name: Start server and worker
        run: |
          ./target/debug/haste-health server start > server.log 2>&1 &
          ./target/debug/haste-health worker > worker.log 2>&1 &
        working-directory: ./backend

      # The base FHIR definitions US Core profile validation resolves
      # (SimpleQuantity, the core extensions such as condition-assertedDate).
      - name: Migrate artifacts
        run: ./target/debug/haste-health admin migrate artifacts
        working-directory: ./backend

      - name: Set up tenant and client
        run: |
          ./target/debug/haste-health admin tenant create --id=my-health '--owner-email=myuser@health.org' --owner-password=testing_password --subscription-tier=unlimited
          ./target/debug/haste-health admin client create --id testing --secret testing --tenant my-health --project system --grant-type client-credentials
          ./target/debug/haste-health config create-profile -n testing --auth-mode client-credentials --r4-url http://localhost:3000/w/my-health/system/api/v1/fhir/r4 --discovery-uri http://localhost:3000/.well-known/openid-configuration/w/my-health/system --id testing --secret testing
        working-directory: ./backend

      # The artifacts load in the background and profile validation finds them
      # through search. The client's access policy is found through search too
      # when a token is issued, and the CLI caches its token. A token issued
      # before the worker indexes the policy carries none, and every request
      # with it is denied, so wait before the first authenticated call (the
      # check below).
      - name: Wait for indexing
        run: bash .github/scripts/wait_for_indexing.sh 600

      - name: Wait for server
        run: |
          for i in {1..30}; do
            if ./target/debug/haste-health api capabilities > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become ready" >&2
          exit 1
        working-directory: ./backend

      - name: Load US Core 7.0.0 profiles
        run: node scripts/load_us_core.mjs hl7.fhir.us.core-7.0.0
        working-directory: ./backend

      - name: Wait for US Core profiles to be indexed
        run: bash .github/scripts/wait_for_indexing.sh 600

      # Exits non-zero if any TestScript fails. `--index-wait-ms` is a
      # ceiling, not a delay: each search waits only until the latest write is
      # indexed.
      - name: Run US Core 7.0.0 TestScripts
        run: >-
          ./target/debug/haste-health testscript run -i testscripts/us-core/7.0.0
          -w 0 --index-wait-ms 30000
          -o us-core-7-${{ matrix.search-backend }}.json
        working-directory: ./backend
        env:
          RUST_LOG: info

      # The website's US Core 7.0.0 conformance page is built from these TestReports
      # (deploy-website in test_e2e.yml).
      - name: Upload US Core TestReports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: us-core-7-testreports-${{ matrix.search-backend }}
          path: backend/us-core-7-${{ matrix.search-backend }}.json
          if-no-files-found: ignore

      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: us-core-7-logs-${{ matrix.search-backend }}
          path: |
            backend/server.log
            backend/worker.log
          if-no-files-found: ignore
