name: <Audit> Autofix

# When an audit fails on main: apply the tooling's fixes, let Claude fix what
# is left, audit again, and open a pull request (.github/scripts/autofix).
#
# - One pull request per audit, from autofix/<audit>. While it is open, new
#   runs for that audit stop at the plan job.
# - Fix jobs run dependency code and Claude with read-only access. Only the
#   publish job can write.
# - Claude signs in with the CLAUDE_CODE_OAUTH_TOKEN secret (your Claude
#   subscription, from `claude setup-token`), or else with workload identity
#   federation (the ANTHROPIC_* repository variables, billed as API usage).
# - Only runs from main open pull requests. The fix job's `autofix`
#   environment should allow only main, and hold the CLAUDE_CODE_OAUTH_TOKEN
#   secret, so no other branch can read it.
# - Opening pull requests needs "Allow GitHub Actions to create and approve
#   pull requests" in the repository's Actions settings.
on:
  workflow_run:
    workflows: ["<Audit> Cargo", "<Audit> Frontend Packages", "<Audit> Docker Image"]
    types: [completed]
  workflow_dispatch:
    inputs:
      audit:
        description: Audit to fix
        required: true
        type: choice
        options:
          ["<Audit> Cargo", "<Audit> Frontend Packages", "<Audit> Docker Image"]

permissions: {}

# One run per audit at a time, so each run sees the pull request of the last.
concurrency:
  group: audit-autofix-${{ inputs.audit || github.event.workflow_run.name }}

env:
  CLAUDE_CODE_VERSION: "2.1.295"
  CLAUDE_MODEL: claude-opus-5-5
  CLAUDE_EFFORT: high
  # Claude's limits: dollars per session, and sessions per 24 hours across all
  # audits (at most one per fix job). The AUTOFIX_CLAUDE_BUDGET_USD and
  # AUTOFIX_CLAUDE_DAILY_SESSIONS repository variables override them.
  CLAUDE_BUDGET_USD: ${{ vars.AUTOFIX_CLAUDE_BUDGET_USD || '10' }}
  CLAUDE_DAILY_SESSIONS: ${{ vars.AUTOFIX_CLAUDE_DAILY_SESSIONS || '3' }}
  DISABLE_AUTOUPDATER: "1"

jobs:
  plan:
    # From main only: a failed audit on main (not a fork's), or a manual run.
    if: >-
      github.ref == 'refs/heads/main' && (inputs.audit || (
        github.event.workflow_run.conclusion == 'failure' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      audit: ${{ steps.plan.outputs.audit }}
      jobs: ${{ steps.plan.outputs.jobs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts/autofix
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: ${{ inputs.audit || github.event.workflow_run.name }}
        run: node .github/scripts/autofix/autofix.mjs plan

  fix:
    name: Fix ${{ matrix.image || matrix.audit }}
    needs: plan
    if: needs.plan.outputs.audit
    environment: autofix
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read # Claude's limits count earlier sessions.
      contents: read
      id-token: write # Workload identity federation.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.jobs) }}
    env:
      AUDIT: ${{ matrix.audit }}
      IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: matrix.audit == 'cargo'
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
          components: clippy
      - if: matrix.audit == 'cargo'
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-audit
      - if: matrix.audit == 'frontend'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.9.0
      - if: matrix.audit == 'frontend'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 23
      # The Trivy version audit_docker.yml's trivy-action uses.
      - if: matrix.audit == 'docker'
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.70.0

      - name: Apply the tooling's fixes
        run: node .github/scripts/autofix/autofix.mjs fix "$AUDIT" "$IMAGE"

      # Claude runs only if findings are left, within its limits.
      - name: Decide whether Claude runs
        id: quota
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
        run: node .github/scripts/autofix/autofix.mjs quota "$AUDIT" "$IMAGE"

      # Just the Linux binary: its package has no install scripts.
      - if: steps.quota.outputs.claude == 'true'
        run: >-
          npm install --prefix "$RUNNER_TEMP/claude-code" --ignore-scripts --no-audit --no-fund
          "@anthropic-ai/claude-code-linux-x64@$CLAUDE_CODE_VERSION"

      # The quota step counts earlier sessions by this name.
      - name: Fix the rest with Claude (${{ matrix.image || matrix.audit }})
        id: claude
        if: steps.quota.outputs.claude == 'true'
        continue-on-error: true
        timeout-minutes: 60
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          # Keeps credentials out of the commands Claude runs (on by default in Actions).
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
          SQLX_OFFLINE: true
        run: node .github/scripts/autofix/autofix.mjs claude "$AUDIT" "$IMAGE"

      - name: Audit again
        if: steps.claude.outcome != 'skipped'
        run: node .github/scripts/autofix/autofix.mjs report "$AUDIT" "$IMAGE"

      - name: Save the changes
        run: git add --all && git diff --cached --binary >"$RUNNER_TEMP/autofix/changes.patch"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: autofix-${{ matrix.image || matrix.audit }}
          path: ${{ runner.temp }}/autofix
          retention-days: 7

  publish:
    needs: [plan, fix]
    runs-on: ubuntu-latest
    permissions:
      actions: write # Runs the checks on the pull request's branch.
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: autofix-*
          path: ${{ runner.temp }}/results
      - env:
          GH_TOKEN: ${{ github.token }}
          AUDIT: ${{ needs.plan.outputs.audit }}
        run: node .github/scripts/autofix/autofix.mjs publish "$AUDIT"
