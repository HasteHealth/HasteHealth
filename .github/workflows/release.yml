name: Release Binaries
on:
  release:
    types: [published]

jobs:
  linux:
    environment: production
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "./backend -> target"
      - name: Build
        run: cd backend && cargo build --locked --release
      - name: Move to linux filename
        run: mv backend/target/release/haste-health ./haste-health_linux
      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            haste-health_linux
  mac:
    environment: production
    runs-on: macos-latest
    permissions:
      packages: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "./backend -> target"
      - name: Build
        run: cd backend && cargo build --locked --release
      - name: Move to macos filename
        run: mv backend/target/release/haste-health ./haste-health_macos
      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            haste-health_macos
