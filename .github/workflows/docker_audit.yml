name: Docker Image Audit

on:
  push:
    branches: ["main"]
    paths:
      - "docker/**"
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/docker_audit.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "docker/**"
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/docker_audit.yml"
  schedule:
    # (SOC2 continuous monitoring).
    - cron: "0 12 * * *"
  workflow_dispatch: {}

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Pull Docker Image from GHCR
        run: |
          docker pull ghcr.io/${{ github.repository_owner }}/haste-health:latest
      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/haste-health.dockerfile
          push: false
          load: true
          tags: haste-health/server:audit
      - name: Scan server image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/haste-health:latest
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          exit-code: "1"
          format: table

  admin-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build admin-app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/admin-app/dockerfile
          push: false
          load: true
          tags: haste-health/admin-app:audit
      - name: Pull Docker Image from GHCR
        run: |
          docker pull ghcr.io/${{ github.repository_owner }}/admin-app:latest
      - name: Scan admin-app image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/admin-app:latest
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          exit-code: "1"
          format: table
