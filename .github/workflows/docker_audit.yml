name: Docker Image Audit

on:
  workflow_run:
    workflows: ["Release Docker"] # Must exactly match the name of the first workflow
    types:
      - completed
  schedule:
    # (SOC2 continuous monitoring).
    - cron: "0 12 * * *"
  workflow_dispatch: {}

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Pull Docker Image from GHCR
        run: |
          docker pull ghcr.io/hastehealth/hastehealth/hastehealth:latest
      - name: Scan server image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/hastehealth/hastehealth/hastehealth:latest
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          exit-code: "1"
          format: table

  admin-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Pull Docker Image from GHCR
        run: |
          docker pull ghcr.io/hastehealth/hastehealth/admin-app:latest
      - name: Scan admin-app image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/hastehealth/hastehealth/admin-app:latest
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          exit-code: "1"
          format: table
