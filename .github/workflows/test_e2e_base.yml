name: <Test> E2E base

# Called by test_e2e.yml, which builds the binary this downloads.
on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        search-backend: [elasticsearch, postgres]
    env:
      HASTE_CERTIFICATION_DIR: certifications
      HASTE_ADMIN_APP_REDIRECT_URI: http://*.localhost:3001
      HASTE_API_URI: http://localhost:3000
      HASTE_REPO.backend: postgres
      HASTE_REPO.database_url: postgresql://postgres:postgres@localhost:5432/haste_health
      RUST_LOG: none

    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.2.4
        ports:
          - 9200:9200
        env:
          ELASTIC_PASSWORD: elastic
          discovery.type: single-node
          xpack.security.enabled: true
          xpack.security.http.ssl.enabled: false
          xpack.license.self_generated.type: trial
          xpack.ml.use_auto_machine_memory_percent: true
          ES_JAVA_OPTS: -Xms128m -Xmx2g
          cluster.routing.allocation.disk.watermark.low: 1gb
          cluster.routing.allocation.disk.watermark.high: 1gb
          cluster.routing.allocation.disk.watermark.flood_stage: 1gb

      postgres:
        # Google's mirror of Docker Hub, which rate-limits anonymous pulls from runners.
        image: mirror.gcr.io/library/postgres:18.1
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        env:
          POSTGRES_DB: haste_health
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: haste-health-binary

      - name: Install binary
        run: |
          mkdir -p backend/target/debug
          tar -xzf haste-health.tar.gz -C backend/target/debug

      # The postgres search backend indexes into its own database, kept apart
      # from the repo's, so the two backends never share tables in this job.
      - name: Create isolated search database (Postgres backend)
        if: matrix.search-backend == 'postgres'
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE haste_health_search;"

      - name: Configure search backend (Elasticsearch)
        if: matrix.search-backend == 'elasticsearch'
        run: |
          echo "HASTE_SEARCH.backend=elasticsearch" >> "$GITHUB_ENV"
          echo "HASTE_SEARCH.url=http://localhost:9200" >> "$GITHUB_ENV"
          echo "HASTE_SEARCH.username=elastic" >> "$GITHUB_ENV"
          echo "HASTE_SEARCH.password=elastic" >> "$GITHUB_ENV"

      - name: Configure search backend (Postgres)
        if: matrix.search-backend == 'postgres'
        run: |
          echo "HASTE_SEARCH.backend=postgres" >> "$GITHUB_ENV"
          echo "HASTE_SEARCH.database_url=postgresql://postgres:postgres@localhost:5432/haste_health_search" >> "$GITHUB_ENV"
          echo "HASTE_SEARCH.max_connections=20" >> "$GITHUB_ENV"

      - name: Wait for Elasticsearch
        if: matrix.search-backend == 'elasticsearch'
        run: |
          for i in {1..60}; do
            curl --silent --fail -u elastic:elastic http://localhost:9200 > /dev/null && exit 0
            sleep 2
          done
          echo "Elasticsearch did not become ready" >&2
          exit 1

      - name: Run migrations
        run: ./target/debug/haste-health admin migrate search && ./target/debug/haste-health admin migrate repo
        working-directory: ./backend

      - name: Start Server
        run: ./target/debug/haste-health server start &
        working-directory: ./backend

      # The two workers run as separate processes here, so the async request
      # TestScripts check `worker async-jobs` on its own; the other e2e
      # workflows run both in one `worker` process.
      - name: Start Workers
        run: |
          ./target/debug/haste-health worker indexing &
          ./target/debug/haste-health worker async-jobs &
        working-directory: ./backend

      - name: Migrate artifacts
        run: ./target/debug/haste-health admin migrate artifacts
        working-directory: ./backend

      - name: Setup Tenant
        run: |
          ./target/debug/haste-health admin tenant create --id=my-health '--owner-email=myuser@health.org' --owner-password=testing_password --subscription-tier=unlimited
          ./target/debug/haste-health admin client create --id testing --secret testing --tenant my-health --project system --grant-type client-credentials
          ./target/debug/haste-health config create-profile -n testing --auth-mode client-credentials --r4-url http://localhost:3000/w/my-health/system/api/v1/fhir/r4 --discovery-uri http://localhost:3000/.well-known/openid-configuration/w/my-health/system --id testing --secret testing
        working-directory: ./backend

      # The artifacts load in the background; terminology and profile
      # validation find them through search, so let indexing catch up first.
      # This also has to come before the first token (Confirm Client App): a
      # token lists the client's access policies found through search, and
      # the CLI caches it.
      - name: Wait for artifacts to be indexed
        run: bash .github/scripts/wait_for_indexing.sh 600

      - name: Confirm Client App
        run: |
          set +e
          for i in {1..5}; do
              ./target/debug/haste-health api capabilities
              if [ "$?" -eq 0 ]; then
                  echo "Condition met. Breaking loop."
                  exit 0;
              fi
              sleep 1
          done
          exit 1;

        working-directory: ./backend

      # `--index-wait-ms` makes each search and operation wait until the
      # TestScript's latest writes are indexed, instead of a fixed delay after
      # every operation.
      - name: Run Base Testscripts
        run: ./target/debug/haste-health testscript run -i testscripts/base -w 0 --index-wait-ms 30000
        working-directory: ./backend
        env:
          RUST_LOG: info

      # Features only the Postgres search backend implements (chained search).
      # Each TestScript here is marked with the testscript-search-backend
      # extension.
      - name: Run Postgres-only Testscripts
        if: matrix.search-backend == 'postgres'
        run: ./target/debug/haste-health testscript run -i testscripts/postgres-only -w 0 --index-wait-ms 30000
        working-directory: ./backend
        env:
          RUST_LOG: info

      - name: R4 Backport Testscripts
        run: ./target/debug/haste-health testscript run -i testscripts/r4-r5-backport -w 0 --index-wait-ms 30000
        working-directory: ./backend
        env:
          RUST_LOG: info

      - name: Load US Core Profiles
        run: node scripts/load_us_core.mjs
        working-directory: ./backend

      - name: Wait for US Core profiles to be indexed
        run: bash .github/scripts/wait_for_indexing.sh 600

      # The website's US Core conformance page is built from these TestReports
      # (deploy-website in test_e2e.yml).
      - name: Run US Core Testscripts
        run: ./target/debug/haste-health testscript run -i testscripts/us-core -w 0 --index-wait-ms 30000 -o us-core-${{ matrix.search-backend }}.json
        working-directory: ./backend
        env:
          RUST_LOG: info

      - name: Upload US Core TestReports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: us-core-testreports-${{ matrix.search-backend }}
          path: backend/us-core-${{ matrix.search-backend }}.json
          if-no-files-found: ignore
