name: Bug report
description: Something does not work the way it should
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you got and what you expected. For an API call, include the request and the response.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag, Docker image tag or commit. Leave blank if unknown.
