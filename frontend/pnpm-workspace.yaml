packages:
  # - "."
  - "artifacts/r4/*"
  - "artifacts/r4b/*"
  - "packages/*"
overrides:
  undici: '^7.29.0'
  mocha>js-yaml: '^4.3.1'
  nanoid: '^3.3.17'
  sharp: '>=0.35.4'
  webpackbar: '^7.0.0'
allowBuilds:
  '@swc/core': false
  core-js: true
  core-js-pure: true
  esbuild: true
  sharp: true
  workerd: true
updateConfig:
  ignoreDependencies:
    - 'codemirror'
    - '@codemirror/*'
auditConfig:
  ignoreGhsas:
    # FPlang code mirror
    - 'GHSA-3ppc-4f35-3m26'
    - 'GHSA-7r86-cg39-jmmj'
    - 'GHSA-23c5-xmqv-rm74'
    - 'GHSA-5c6j-r48x-rmvq'
    # Transitive dep in mocha test package
    # for js-yaml
    - 'GHSA-52cp-r559-cp3m'
    # Fhirpath
    - 'GHSA-r5fr-rjxr-66jc'
    # Brace expansion DoS not affecting us, but we are ignoring it to avoid noise
    - 'GHSA-mh99-v99m-4gvg'
    # image-size not fixed yet.
    - 'GHSA-w3rx-r6r6-pgpr'
    - 'GHSA-5p2g-fcmc-qvqq'

minimumReleaseAgeExclude:
  - brace-expansion@1.1.16 || 1.1.18 || 2.1.2 || 2.1.4 || 5.0.8 || 5.0.9
  - js-yaml@3.15.1 || 3.15.2 || 4.1.1 || 4.1.2 || 4.3.0 || 4.3.1 || 4.3.2
  - esbuild@0.24.3
  - nanoid@3.3.8 || 3.3.16 || 3.3.17
  - diff@5.2.2
  - lodash-es@4.17.24
  - serialize-javascript@6.0.2 || 7.0.5
  - uuid@11.1.1
  - webpack-dev-server@5.2.6
  - body-parser@1.20.6
  - svgo@2.8.3 || 2.8.4 || 3.3.4 || 3.3.5 || 4.0.2 || 4.1.0
  - dompurify@3.4.12 || 3.4.13
  - react-router@8.3.0
  - miniflare@4.20260722.1 || 5.20260908.0-alpha
  - wrangler@4.115.0 || 4.130.0
  - undici@7.29.0
  - fast-uri@3.1.5 || 3.1.6
  - mermaid@11.16.1
  - image-size@2.0.3
  - browserslist@4.28.7
  - qs@6.15.4 || 6.16.0
  - joi@17.13.5 || 17.13.6
