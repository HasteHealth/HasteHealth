packages:
  # - "."
  - "../artifacts/r4/*"
  - "../artifacts/r4b/*"
  - "packages/*"
overrides:
  undici: '^7.29.1'
  mocha>js-yaml: '^4.3.1'
  nanoid: '^3.3.17'
  sharp: '>=0.35.5'
  proxy-addr: '^2.0.8'
  shell-quote: '^1.11.0'
  source-map-js: '^1.2.2'
  compression: '^1.8.2'
  # Docusaurus 3 asks for ^1, but only 2.1.2 is patched; Docusaurus 4 uses ^2.
  tinypool: '^2.1.2'
  webpackbar: '^7.0.0'
  markdown-it: '^14.3.1'
  webpack-dev-middleware: '^7.4.6'
  image-size: '^2.0.3'
  qs: '^6.16.0'
  'uuid@<11.1.1': '^11.1.1'
  serialize-javascript: '^7.0.5'
  lodash-es: '^4.18.0'
  'brace-expansion@<2.0.0': '^1.1.21'
  'brace-expansion@>=2.0.0 <3.0.0': '^2.1.7'
  'brace-expansion@>=4.0.0': '^5.0.12'
allowBuilds:
  '@swc/core': false
  core-js: true
  core-js-pure: true
  esbuild: true
  sharp: true
  workerd: true
updateConfig:
  ignoreDependencies:
    - 'codemirror'
    - '@codemirror/*'
auditConfig:
  ignoreGhsas:
    # FPlang code mirror
    - 'GHSA-3ppc-4f35-3m26'
    - 'GHSA-7r86-cg39-jmmj'
    - 'GHSA-23c5-xmqv-rm74'
    - 'GHSA-5c6j-r48x-rmvq'
    # Transitive dep in mocha test package
    # for js-yaml
    - 'GHSA-52cp-r559-cp3m'
    # No patched release yet (braces <=3.0.3, latest 3.0.3). Only reached by
    # build tooling: micromatch/chokidar in devDependencies and the website's
    # Docusaurus build. Remove once braces ships a fix.
    - 'GHSA-vfj7-8cjw-p6xm'
    # No patched release yet (http-cache-semantics <=4.2.0, latest 4.2.0).
    # Only reached by Docusaurus's update-notifier in the website build, a
    # single-user client cache rather than a shared one. Remove once
    # http-cache-semantics ships a fix.
    - 'GHSA-ch52-4w7c-c8xp'

minimumReleaseAgeExclude:
  - brace-expansion@1.1.16 || 1.1.18 || 1.1.21 || 2.1.2 || 2.1.4 || 2.1.7 || 5.0.8 || 5.0.9 || 5.0.12
  - js-yaml@3.15.1 || 3.15.2 || 4.1.1 || 4.1.2 || 4.3.0 || 4.3.1 || 4.3.2
  - esbuild@0.24.3
  - nanoid@3.3.8 || 3.3.16 || 3.3.17
  - diff@5.2.2
  - lodash-es@4.17.24 || 4.18.0 || 4.18.1
  - serialize-javascript@6.0.2 || 7.0.5 || 7.1.2
  - uuid@11.1.1
  - webpack-dev-server@5.2.6
  - body-parser@1.20.6
  - svgo@2.8.3 || 2.8.4 || 3.3.4 || 3.3.5 || 4.0.2 || 4.1.0
  - dompurify@3.4.12 || 3.4.13
  - react-router@8.3.0
  - miniflare@4.20260722.1 || 5.20260908.0-alpha
  - wrangler@4.115.0 || 4.130.0
  - undici@7.29.0 || 7.29.1 || 7.30.0
  - fast-uri@3.1.5 || 3.1.6
  - mermaid@11.16.1
  - image-size@2.0.3 || 2.0.4
  - markdown-it@14.3.1 || 14.3.2
  - webpack-dev-middleware@7.4.6
  - browserslist@4.28.7
  - qs@6.15.4 || 6.16.0
  - joi@17.13.5 || 17.13.6
  - colord@2.9.4
  - baseline-browser-mapping@2.11.0
  - sharp@0.35.4
  - multer@2.3.0 || 2.4.0
