packages:
  # - "."
  - "artifacts/r4/*"
  - "artifacts/r4b/*"
  - "packages/*"
allowBuilds:
  core-js: true
  core-js-pure: true
  esbuild: true
  sharp: true
  workerd: true
updateConfig:
  ignoreDependencies:
    - 'codemirror'
    - '@codemirror/*'
auditConfig:
  ignoreGhsas:
    # FPlang code mirror
    - 'GHSA-3ppc-4f35-3m26'
    - 'GHSA-7r86-cg39-jmmj'
    - 'GHSA-23c5-xmqv-rm74'
    - 'GHSA-5c6j-r48x-rmvq'
    # Transitive dep in mocha test package
    # for js-yaml
    - 'GHSA-52cp-r559-cp3m'
    # Fhirpath
    - 'GHSA-r5fr-rjxr-66jc'
    # Brace expansion DoS not affecting us, but we are ignoring it to avoid noise
    - 'GHSA-mh99-v99m-4gvg'

minimumReleaseAgeExclude:
  - brace-expansion@1.1.16 || 1.1.18 || 2.1.2 || 2.1.4 || 5.0.8 || 5.0.9
  - js-yaml@3.15.1 || 4.1.1 || 4.1.2 || 4.3.0 || 4.3.1
  - esbuild@0.24.3
  - nanoid@3.3.8 || 3.3.16 || 3.3.17
  - diff@5.2.2
  - lodash-es@4.17.24
  - serialize-javascript@6.0.2 || 7.0.5
  - uuid@11.1.1
  - webpack-dev-server@5.2.6
  - body-parser@1.20.6
  - svgo@2.8.3 || 3.3.4 || 4.0.2
  - dompurify@3.4.12 || 3.4.13
  - react-router@8.3.0
  - miniflare@4.20260722.1
  - wrangler@4.115.0
  - undici@7.29.0
  - fast-uri@3.1.5
  - mermaid@11.16.1
  - image-size@2.0.3
