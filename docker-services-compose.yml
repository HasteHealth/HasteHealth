services:
  postgres:
    image: postgres:18.1
    ports:
      - 5432:5432
    # A named volume rather than a host bind mount: Docker creates it on
    # demand, so the quick start works in any empty directory without the
    # host path having to exist or be shared with Docker Desktop.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # The search backend indexes into its own database, kept apart from the
    # repository's. The entrypoint runs this during initdb, before the server
    # accepts connections, so it only fires on a fresh data directory. Kept
    # inline so this compose file stays self-contained: the quick start is a
    # single curl of this file.
    configs:
      - source: create-search-db
        target: /docker-entrypoint-initdb.d/10-create-search-db.sh
    environment:
      - POSTGRES_DB=haste_health
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - PGDATA=/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres && psql -U postgres -lqt | cut -d'|' -f1 | grep -qw haste_health_search",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s

  hastehealth-migrate:
    image: ghcr.io/hastehealth/hastehealth/hastehealth:latest
    platform: linux/amd64
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/bash"]
    command: >
      -c "/haste-health admin migrate all && /haste-health admin tenant create --id=my-health '--owner-email=myuser@health.org' --owner-password=testing_password --subscription-tier=unlimited"

    environment:
      - HASTE_REPO.backend=postgres
      - HASTE_REPO.database_url=postgresql://postgres:postgres@postgres:5432/haste_health
      - HASTE_REPO.max_connections=20
      - HASTE_SEARCH.backend=postgres
      - HASTE_SEARCH.database_url=postgresql://postgres:postgres@postgres:5432/haste_health_search
      - HASTE_SEARCH.max_connections=20
      - HASTE_API_URI=http://localhost:3000

configs:
  create-search-db:
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      psql -v ON_ERROR_STOP=1 -U "$$POSTGRES_USER" \
        --dbname "$$POSTGRES_DB" \
        -c 'CREATE DATABASE haste_health_search'

volumes:
  postgres-data:
